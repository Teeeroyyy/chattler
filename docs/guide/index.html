<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chattler user guide has moved</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="https://docs.chattler.net/guide">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="0; url=https://docs.chattler.net/guide">
  <style>
    body { background: #111318; color: #dfe2ea; font: 16px/1.6 "Segoe UI", system-ui, sans-serif;
      display: grid; place-items: center; min-height: 100vh; margin: 0; text-align: center; padding: 24px; }
    a { color: #9b8cff; }
  </style>
</head>
<body>
  <main>
    <h1>The user guide has moved</h1>
    <p>It now lives at <a id="go" href="https://docs.chattler.net/guide">docs.chattler.net/guide</a>, alongside the plugin and theme docs.</p>
  </main>
  <script>
    // Carry the section across, so an old link like /guide/#privacy still lands on it.
    var target = "https://docs.chattler.net/guide" + (location.hash || '');
    document.getElementById('go').href = target;
    location.replace(target);
  </script>
</body>
</html>
